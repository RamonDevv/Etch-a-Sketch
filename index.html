<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="../Etch-a-Sketch/main.js" defer></script>
</head>
<style>
:root {
  --grid-cols: 1;
  --grid-rows: 1;
}

#container {
    display: flex;
    flex-wrap: wrap;
    width: 640px;
}

.grid-item {
    box-sizing: border-box;
    width: 40px;
    height: 40px;
    border: 1px solid #ccc;
}

.grid-item:hover {
    background-color: rgb(0, 0, 0);
}

#sizebtn {
    margin-bottom: 2px;
}
</style>
<body>
    <button id="sizebtn">New size</button>
    <div id="container"></div>
</body>
</html>
